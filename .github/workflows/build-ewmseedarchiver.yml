name: Build ewmseedarchiver for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Inspect repository
        shell: powershell
        run: |
          Write-Host "Repository root:"
          Get-Location

          Write-Host "`nEarthworm environment files:"
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -in @(
                "ew_nt.cmd",
                "ew_nt.bat",
                "makefile.nt",
                "ewmseedarchiver.c"
              )
            } |
            Select-Object FullName

      - name: Configure MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          where cl
          where nmake
          cl 2>&1 | findstr /i "Version"

      - name: Build ewmseedarchiver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          call environment\ew_nt.cmd

          rem ew_nt.cmd contains installation defaults. Point the build to
          rem the GitHub Actions checkout instead.
          set EW_HOME=D:\a\earthworm
          set EW_VERSION=earthworm
          set INCLUDE=%CD%\include;%CD%\include_win;%INCLUDE%
          set LIB=%CD%\lib;%LIB%

          rem Build the Earthworm objects and libraries used by this module.
          cd src\libsrc\util
          nmake /f makefile.nt
          cd ..\winnt
          nmake /f makefile.nt
          cd ..
          nmake /f makefile.nt %EW_HOME%\%EW_VERSION%\lib\libew_mt.lib

          cd ..\archiving\ewmseedarchiver
          nmake /f makefile.nt clean
          nmake /f makefile.nt

      - name: Find executable
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Recurse -File `
            -Filter "ewmseedarchiver.exe" |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ewmseedarchiver-windows-x64
          path: |
            **/ewmseedarchiver.exe
          if-no-files-found: error
