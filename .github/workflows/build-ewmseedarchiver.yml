name: Build ewmseedarchiver for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Inspect repository
        shell: powershell
        run: |
          Write-Host "Repository root:"
          Get-Location

          Write-Host "`nEarthworm environment files:"
          Get-ChildItem -Recurse -File |
            Where-Object {
              $_.Name -in @(
                "ew_nt.cmd",
                "ew_nt.bat",
                "makefile.nt",
                "ewmseedarchiver.c"
              )
            } |
            Select-Object FullName

      - name: Configure MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          where cl
          where nmake
          cl 2>&1 | findstr /i "Version"

      - name: Build ewmseedarchiver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86

          echo Current directory:
          cd

          echo Searching for module:
          dir /s /b ewmseedarchiver.c
          dir /s /b makefile.nt
          dir /s /b ew_nt.cmd

          rem SESUAIKAN dua baris berikut berdasarkan hasil Inspect repository
          call environment\ew_nt.cmd
          cd src\archiving\ewmseedarchiver

          echo Module directory:
          cd
          dir

          nmake /f makefile.nt clean
          nmake /f makefile.nt

      - name: Find executable
        if: always()
        shell: powershell
        run: |
          Get-ChildItem -Recurse -File `
            -Filter "ewmseedarchiver.exe" |
            Select-Object FullName, Length, LastWriteTime

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ewmseedarchiver-windows-x86
          path: |
            **/ewmseedarchiver.exe
          if-no-files-found: error
